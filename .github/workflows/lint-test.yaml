name: Lint and Test

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.2
  TERRAFORM_VERSION: 1.15.6
  TERRAGRUNT_VERSION: v1.2.2

jobs:
  chart:
    name: Chart lint and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: helm/chart-testing-action@v2.9.0

      - name: List changed charts
        id: list-changed
        run: |
          changed="$(ct list-changed --config ct.yaml)"
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ct lint
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config ct.yaml

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.15.2

      # Installs with charts/*/ci/*-values.yaml (ingress TLS disabled) and runs `helm test`.
      - name: ct install
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config ct.yaml

  iac-fmt:
    name: Terraform / Terragrunt fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          curl -fsSL -o terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/${TERRAGRUNT_VERSION}/terragrunt_linux_amd64"
          sudo install -m 0755 terragrunt /usr/local/bin/terragrunt
          terragrunt --version

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra terraform-library

      - name: terragrunt hcl fmt
        run: terragrunt hcl fmt --check --diff --working-dir infra
