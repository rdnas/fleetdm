name: Release Charts

on:
  push:
    branches: [main]
    paths:
      - "charts/**"

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  HELM_VERSION: v4.3.2

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      # Creates GitHub Release fleetdm-<version> and updates index.yaml on gh-pages.
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.9.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts to GHCR (OCI)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          shopt -s nullglob
          packages=(.cr-release-packages/*.tgz)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No new chart packages to push."
            exit 0
          fi
          owner="${OWNER,,}"
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for pkg in "${packages[@]}"; do
            helm push "$pkg" "oci://ghcr.io/${owner}/charts"
          done
