{{- if not .Values.fleet.existingSecret }}
{{- $name := include "fleetdm.fleet.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetdm.componentLabels" (dict "ctx" . "component" "fleet") | nindent 4 }}
type: Opaque
data:
  server-private-key: {{ include "fleetdm.secretValue" (dict "ctx" . "secret" $name "key" "server-private-key" "length" 48) }}
{{- end }}
