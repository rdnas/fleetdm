{{- if not .Values.mysql.existingSecret }}
{{- $name := include "fleetdm.mysql.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetdm.componentLabels" (dict "ctx" . "component" "mysql") | nindent 4 }}
type: Opaque
data:
  mysql-password: {{ include "fleetdm.secretValue" (dict "ctx" . "secret" $name "key" "mysql-password" "length" 24) }}
  mysql-root-password: {{ include "fleetdm.secretValue" (dict "ctx" . "secret" $name "key" "mysql-root-password" "length" 24) }}
{{- end }}
