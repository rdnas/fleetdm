{{- if and .Values.redis.auth.enabled (not .Values.redis.auth.existingSecret) }}
{{- $name := include "fleetdm.redis.secretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetdm.componentLabels" (dict "ctx" . "component" "redis") | nindent 4 }}
type: Opaque
data:
  redis-password: {{ include "fleetdm.secretValue" (dict "ctx" . "secret" $name "key" "redis-password" "length" 24) }}
{{- end }}
