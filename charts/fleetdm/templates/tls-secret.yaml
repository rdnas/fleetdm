{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled .Values.ingress.tls.selfSigned }}
{{- if empty .Values.ingress.hosts }}
{{- fail "ingress.hosts must contain at least one host when ingress.tls.selfSigned is true" }}
{{- end }}
{{- $days := int .Values.ingress.tls.validityDays }}
{{- $hosts := uniq .Values.ingress.hosts }}
{{- $ips := .Values.ingress.tls.extraIPs | default list }}
{{- $sans := printf "%s|%s" (join "," $hosts) (join "," $ips) }}
{{- $caName := printf "%s-ca" (include "fleetdm.fullname" .) }}

{{- /* The CA is generated once and reused, so agents keep trusting fleet-ca.pem across upgrades and SAN changes. */}}
{{- $caSecret := lookup "v1" "Secret" .Release.Namespace $caName }}
{{- $ca := dict }}
{{- if and $caSecret $caSecret.data (hasKey $caSecret.data "ca.key") }}
{{- $ca = buildCustomCert (index $caSecret.data "ca.crt") (index $caSecret.data "ca.key") }}
{{- else }}
{{- $ca = genCA .Values.ingress.tls.caCommonName $days }}
{{- end }}

{{- /* The server certificate is reused unless the SANs changed. */}}
{{- $tlsSecret := lookup "v1" "Secret" .Release.Namespace .Values.ingress.tls.secretName }}
{{- $crt := "" }}
{{- $key := "" }}
{{- if and $tlsSecret $tlsSecret.data $caSecret (eq (dig "metadata" "annotations" "fleetdm.io/sans" "" $tlsSecret) $sans) }}
{{- $crt = index $tlsSecret.data "tls.crt" }}
{{- $key = index $tlsSecret.data "tls.key" }}
{{- else }}
{{- $cert := genSignedCert (first $hosts) $ips $hosts $days $ca }}
{{- $crt = $cert.Cert | b64enc }}
{{- $key = $cert.Key | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $caName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetdm.componentLabels" (dict "ctx" . "component" "fleet") | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ $ca.Cert | b64enc }}
  ca.key: {{ $ca.Key | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingress.tls.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fleetdm.componentLabels" (dict "ctx" . "component" "fleet") | nindent 4 }}
  annotations:
    fleetdm.io/sans: {{ $sans | quote }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}
